version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: api
    opt:
    - paths=source_relative
    - default_api_level=API_HYBRID
  - remote: buf.build/protocolbuffers/java:v29.3
    out: src/main/java
  - remote: buf.build/protocolbuffers/kotlin:v29.3
    out: src/main/kotlin
inputs:
  - directory: proto